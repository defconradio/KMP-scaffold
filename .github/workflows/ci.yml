name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
           gradle-version: wrapper

      - name: Build Android App
        run: ./gradlew :androidApp:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Build Shared Module (Wasm & JVM)
        run: ./gradlew :shared:assemble --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Build Web App (Wasm)
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Run Tests (JVM & Android)
        run: ./gradlew :shared:jvmTest :shared:testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Run Tests (Wasm)
        run: |
          export CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium)
          ./gradlew :shared:wasmJsBrowserTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" -Dkotlin.daemon.jvmargs="-Xmx2g"
